<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kurzusok és interaktív oktatóanyagok.">
<title>Courses</title>
<style>
:root { color-scheme: light; --ink:#182a3c; --muted:#4d5b65; --navy:#152f4b; --teal:#12665e; --paper:#fcfbf7; --rule:#c4cdd2; --serif:"STIX Two Text",Georgia,serif; --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); font: 1rem/1.5 var(--sans); }
h1, h2, p, dl, dd { margin: 0; }
.hero { background: var(--navy); color: var(--paper); }
.wrap { width: min(calc(100% - 2.5rem), 67rem); margin: 0 auto; }
.hero .wrap { padding: clamp(2.3rem, 7vw, 5.5rem) 0 clamp(2.1rem, 5vw, 3.65rem); }
h1 { font: 600 clamp(3rem, 8.5vw, 6.7rem)/.98 var(--serif); letter-spacing: -.038em; }
.hero p { color: #dbe6ec; margin-top: .65rem; font-size: clamp(1.05rem, 2.4vw, 1.35rem); }
main.wrap { padding: clamp(1.4rem, 4vw, 3.1rem) 0 3rem; }
.course { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(13rem, .72fr); gap: 1.6rem; align-items: center; background: #e7eef4; border: 1px solid #b9c9d8; border-left: 5px solid var(--teal); border-radius: 4px; padding: clamp(1.2rem, 3.2vw, 2.25rem); }
.course h2 { font: 650 clamp(1.85rem, 4.5vw, 3.2rem)/1.04 var(--serif); letter-spacing: -.018em; }
.course p { max-width: 36rem; margin: .6rem 0 1.15rem; color: var(--muted); font-size: 1.05rem; }
.open { display: inline-flex; gap: .45em; align-items: center; background: var(--navy); color: white; padding: .56rem .88rem; border-radius: 4px; text-decoration: none; font-weight: 630; }
.open:hover { background: #225078; }
a:focus-visible { outline: 3px solid #9b6609; outline-offset: 4px; }
dl { border-top: 1px solid #aabac7; }
dl div { display: flex; justify-content: space-between; gap: .5rem; border-bottom: 1px solid #aabac7; padding: .57rem 0; }
dt { color: var(--muted); }
dd { font-weight: 650; text-align: right; }
@media (max-width: 650px) {
  .course { grid-template-columns: 1fr; gap: 1.1rem; }
  .wrap { width: calc(100% - 1.6rem); }
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>Courses</h1>
    <p>Kurzusok és interaktív oktatóanyagok</p>
  </div>
</header>
<main class="wrap" aria-label="Tananyagok">
  <article class="course">
    <div>
      <h2>Hogyan működik egy LLM?</h2>
      <p>Az LLM működése a gyakoriságoktól a Transformerig. Magyar magyarázat angol szakkifejezésekkel és végigszámolt példákkal.</p>
      <a class="open" href="./llm/">Tananyag megnyitása <span aria-hidden="true">→</span></a>
    </div>
    <dl>
      <div><dt>Nyelv</dt><dd>magyar</dd></div>
      <div><dt>Teljes anyag</dt><dd>73 dia</dd></div>
      <div><dt>Alapút</dt><dd>48 dia</dd></div>
    </dl>
  </article>
</main>
</body>
</html>
